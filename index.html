:root{
  --sand:#f5e9d2; --sand-2:#ecd9b4; --sand-3:#d9bf8f; --cream:#fffaf0; --ink:#1e2a21; --muted:#6b7366;
  --cactus:#2f9e5a; --cactus-2:#1f7a43; --cactus-3:#86d9a3; --sun:#f2b544; --sun-2:#e0962a; --clay:#c9633a; --clay-2:#9a4727; --bad:#d6473a; --good:#2f9e5a;
  --display:"Secular One","Rubik",-apple-system,"Segoe UI",sans-serif; --body:"Rubik",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bw:3px; --sh:4px 4px 0 var(--ink); --sh-s:3px 3px 0 var(--ink); --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sand);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.35;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.05;text-wrap:balance;font-family:var(--display);font-weight:400}
.num{font-variant-numeric:tabular-nums;unicode-bidi:plaintext}

/* ground decoration */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco .sun{position:absolute;width:26vw;height:26vw;max-width:240px;max-height:240px;border-radius:50%;background:var(--sun);border:var(--bw) solid var(--ink);top:-7vw;right:-6vw;opacity:.9}
[dir=rtl] .deco .sun{right:auto;left:-6vw}
.deco .dune{position:absolute;bottom:-2px;left:-5%;width:110%;height:16vh}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));max-width:900px;margin:0 auto;width:100%}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* header */
.hdr{display:flex;align-items:center;gap:14px;height:56px;flex:none}
.brand{font-family:var(--display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--ink)}
.brand i{width:14px;height:20px;border-radius:7px 7px 4px 4px;background:var(--cactus);border:2px solid var(--ink);display:inline-block}
.brand img{height:40px;width:auto;display:block}
.attract .logo{display:flex;justify-content:center;margin-bottom:6px}
.attract .logo img{height:clamp(48px,7vh,80px);width:auto;max-width:70vw}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--cream)}
.dots i.done{background:var(--cactus)} .dots i.cur{background:var(--sun);transform:scale(1.25)}
.scorechip{margin-inline-start:auto;background:var(--ink);color:var(--cream);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:22px;line-height:1;display:flex;align-items:baseline;gap:6px}
.scorechip small{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}

/* stage: cactus + bubble */
.stage{display:flex;align-items:center;gap:18px;height:clamp(160px,24vh,250px);flex:none;margin-top:4px}
.stage svg{height:100%;width:auto;flex:none;overflow:visible}
.bubble{flex:1;min-width:0;position:relative;background:var(--cream);border:var(--bw) solid var(--ink);border-radius:22px;box-shadow:var(--sh);padding:16px 20px;font-size:clamp(20px,2.8vh,28px);font-weight:600;line-height:1.3}
.bubble::after{content:"";position:absolute;top:50%;margin-top:-10px;width:18px;height:18px;background:var(--cream);border:var(--bw) solid var(--ink)}
[dir=rtl] .bubble::after{right:-12px;transform:rotate(45deg);border-bottom:0;border-left:0}
[dir=ltr] .bubble::after{left:-12px;transform:rotate(45deg);border-top:0;border-right:0}
.bubble.big{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vh,34px);line-height:1.2}

/* game area */
.game{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:14px;gap:12px}
.title{font-family:var(--display);font-size:clamp(28px,3.8vh,40px);line-height:1.1}
.timer{height:14px;background:var(--cream);border:var(--bw) solid var(--ink);border-radius:999px;overflow:hidden;flex:none;padding:2px}
.timer i{display:block;height:100%;background:var(--sun);border-radius:999px;width:100%}
.timer.low i{background:var(--bad)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;padding:12px 20px;border-radius:var(--r);border:var(--bw) solid var(--ink);background:var(--cream);box-shadow:var(--sh);font-weight:700;font-size:22px;transition:transform .07s,box-shadow .07s;color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--cactus);color:#fff;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.01em}
.btn.ghost{background:var(--sand-2)}
.btn.small{min-height:46px;font-size:17px;width:auto;padding:8px 16px;border-radius:12px;box-shadow:var(--sh-s)}
.btn[disabled]{opacity:.5;transform:none}
.btn.ok{background:var(--cactus-3)} .btn.no{background:#f3c4bd;opacity:.8}
.btn.on{background:var(--cactus);color:#fff}
.row{display:flex;gap:12px}
.row .btn{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:52px;padding:10px 18px;border-radius:999px;border:var(--bw) solid var(--ink);background:var(--cream);box-shadow:var(--sh-s);font-weight:700;font-size:19px;transition:transform .07s,box-shadow .07s}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.on{background:var(--cactus);color:#fff}
.card{background:var(--cream);border:var(--bw) solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink)}
.lab{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* attract */
.attract{justify-content:space-between;gap:10px}
.attract .hero{text-align:center;padding-top:1vh}
.attract .hero .eyebrow{font-family:var(--display);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay-2)}
.attract .hero h1{font-size:clamp(46px,8.4vh,92px);line-height:.95;margin-top:4px;text-shadow:5px 5px 0 var(--sun)}
.attract .stage{height:clamp(220px,30vh,330px);justify-content:center;gap:22px}
.attract .stage .bubble{flex:0 1 auto;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.panels{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;min-height:0;flex:1}
.panel{background:var(--cream);border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:var(--sh);padding:14px 18px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.panel h3{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lb{list-style:none;margin:0;padding:0;overflow:hidden}
.lb li{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed var(--sand-3);font-size:20px}
.lb li:first-child{border-top:0}
.lb .r{font-family:var(--display);color:var(--muted);font-size:18px}
.lb li:nth-child(1) .r,.lb li:nth-child(2) .r,.lb li:nth-child(3) .r{color:var(--sun-2)}
.lb .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lb .n small{color:var(--muted);font-weight:500;font-size:13px;margin-inline-start:6px}
.lb .s{font-family:var(--display);font-size:22px}
.lb li.me{background:var(--cactus-3);margin:0 -10px;padding:8px 10px;border-radius:10px;border-top:0}
.fac{display:grid;gap:10px}
.fac div{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:15px;font-weight:600;align-items:center}
.fac b{display:block;height:12px;background:var(--sand);border:2px solid var(--ink);border-radius:6px;overflow:hidden;grid-column:1/-1}
.fac b i{display:block;height:100%;background:var(--cactus)}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:16px;font-weight:500;margin:auto}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);flex:none;min-height:34px}
.langpill{border:2px solid var(--ink);background:var(--cream);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--ink);letter-spacing:.04em;color:var(--ink)}

/* form */
.form{display:grid;gap:12px;padding:4px 4px 14px}
html.docscroll,html.docscroll body{overflow:auto;height:auto;min-height:100%}
html.docscroll #app{height:auto;min-height:100vh}
html.docscroll .screen{flex:none}
html.docscroll .game{flex:none}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;min-height:62px;padding:12px 16px;border:var(--bw) solid var(--ink);border-radius:14px;background:var(--cream);font-size:22px;font-weight:600;box-shadow:var(--sh-s);-webkit-user-select:text;user-select:text}
.field input:focus{outline:none;background:#fff;box-shadow:3px 3px 0 var(--cactus)}
.field input.bad{box-shadow:3px 3px 0 var(--bad)}
.consent{display:flex;align-items:center;gap:14px;padding:12px 16px;border:var(--bw) solid var(--ink);border-radius:14px;background:var(--cream);box-shadow:var(--sh-s);font-size:17px;font-weight:600}
.consent input{width:26px;height:26px;accent-color:var(--cactus);margin:0;flex:none}
.err{color:var(--bad);font-size:15px;font-weight:700;min-height:1.2em}

/* logo game */
.logoBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--cream);border:var(--bw) solid var(--ink);border-radius:22px;box-shadow:var(--sh);overflow:hidden;position:relative}
.logoBox::before{content:"?";position:absolute;top:-6px;inset-inline-start:16px;font-family:var(--display);font-size:64px;color:var(--sand-3);line-height:1}
.logoBox canvas{max-width:100%;max-height:100%}

/* slider game */
.q{font-size:clamp(21px,3vh,28px);font-weight:600;line-height:1.35}
.slider{text-align:center;padding:4px 0}
.slider output{display:block;font-family:var(--display);font-size:clamp(64px,10vh,100px);line-height:1}
.slider output small{font-family:var(--body);font-size:22px;color:var(--muted);font-weight:600;margin-inline-start:8px}
.slider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;margin:26px 0 8px;height:44px;background:transparent}
.slider input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:999px;background:var(--cream);border:var(--bw) solid var(--ink)}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:var(--cactus);border:var(--bw) solid var(--ink);box-shadow:var(--sh-s);margin-top:-17px}
.slider .ends{display:flex;justify-content:space-between;color:var(--muted);font-weight:700}

/* deal card */
.cardWrap{flex:1;min-height:0;position:relative;touch-action:none}
.deal{position:absolute;inset:0;padding:0;display:flex;flex-direction:column;will-change:transform;overflow:hidden}
.deal .head{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:var(--bw) solid var(--ink);background:var(--sand-2);font-family:var(--display);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.deal .pitch{font-size:clamp(23px,3.2vh,31px);font-weight:600;line-height:1.45;flex:1;overflow:auto;display:flex;align-items:center;padding:20px 24px}
.deal .stamp{position:absolute;top:70px;padding:8px 16px;border:5px solid;border-radius:12px;font-family:var(--display);font-size:34px;letter-spacing:.06em;opacity:0;background:rgba(255,250,240,.9)}
.deal .stamp.inv{color:var(--good);border-color:var(--good);left:22px;transform:rotate(-12deg)}
.deal .stamp.pas{color:var(--bad);border-color:var(--bad);right:22px;transform:rotate(12deg)}
.dealBtns{display:flex;gap:12px;flex:none;direction:ltr}
.dealBtns .btn{flex:1;font-family:var(--display);font-weight:400;font-size:28px}
.btn.invest{background:var(--cactus);color:#fff}
.btn.pass{background:#f6d9d2}

/* reveal */
.reveal{flex:1;display:flex;flex-direction:column;gap:10px;padding:20px 24px;min-height:0;overflow:auto}
.reveal .verdict{display:inline-block;align-self:flex-start;font-family:var(--display);font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:2px solid var(--ink)}
.reveal .verdict.ok{background:var(--cactus-3)} .reveal .verdict.no{background:#f3c4bd}
.reveal .pts{font-family:var(--display);font-size:clamp(52px,8vh,84px);line-height:1}
.reveal .pts.zero{color:var(--muted)}
.logoMini{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.reveal .big{font-family:var(--display);font-size:clamp(30px,4.4vh,44px);line-height:1.1}
.reveal p{margin:0;font-size:clamp(18px,2.5vh,24px);line-height:1.4;font-weight:500}
.reveal .crowd{margin-top:auto;padding-top:12px;border-top:2px dashed var(--sand-3);display:flex;align-items:center;gap:12px;font-weight:700;color:var(--muted)}
.reveal .crowd b{display:block;height:12px;background:var(--sand);border:2px solid var(--ink);border-radius:6px;flex:1;overflow:hidden}
.reveal .crowd b i{display:block;height:100%;background:var(--cactus)}
[dir=rtl] .reveal .pts,[dir=rtl] .reveal .big{text-align:right}
[dir=ltr] .reveal .pts,[dir=ltr] .reveal .big{text-align:left}
.hint{color:var(--muted);font-size:15px;font-weight:600;text-align:center;flex:none}

/* maze */
.mazeWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
.mazeWrap canvas{touch-action:none;border-radius:16px;border:var(--bw) solid var(--ink);box-shadow:var(--sh)}
.mazeHud{display:flex;justify-content:space-between;align-items:center;flex:none;gap:10px}
.mazeHud .title{font-size:clamp(26px,3.4vh,36px)}
.hudchip{background:var(--cream);border:var(--bw) solid var(--ink);border-radius:999px;padding:6px 16px;font-family:var(--display);font-size:22px;box-shadow:var(--sh-s)}

/* score */
.scoreBox{text-align:center;padding:6px 0 0}
.scoreBox .big{font-family:var(--display);font-size:clamp(90px,17vh,160px);line-height:1;text-shadow:5px 5px 0 var(--sun)}
.scoreBox .big small{font-family:var(--body);font-size:22px;color:var(--muted);font-weight:600;text-shadow:none}
.scoreBox .rank{font-size:21px;font-weight:700;margin-top:4px}
.scoreBox .rank b{background:var(--ink);color:var(--cream);padding:2px 10px;border-radius:999px;font-family:var(--display);font-weight:400}
.ctas{display:grid;gap:12px}
.ctas .btn{justify-content:flex-start;text-align:start;min-height:70px}
.ctas .btn .chk{width:32px;height:32px;border-radius:9px;border:var(--bw) solid var(--ink);flex:none;display:grid;place-items:center;font-size:18px;background:var(--cream);color:var(--ink)}
.ctas .btn div{min-width:0}
.ctas .btn span{display:block;font-weight:500;font-size:15px;color:var(--muted)}
.ctas .btn.on span{color:rgba(255,255,255,.85)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

/* admin */
.adminHit{position:fixed;top:0;left:0;width:60px;height:60px;z-index:40;background:transparent;border:0}
.admin{position:fixed;inset:0;background:var(--sand);z-index:50;padding:20px;overflow:auto;display:grid;gap:12px;align-content:start;max-width:620px;margin:0 auto;width:100%;direction:ltr;text-align:left}
.admin h2{font-size:26px}
.admin .kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--cream);border:2px solid var(--ink);border-radius:12px;font-weight:600}
.admin .kv span{display:flex;align-items:center;gap:10px}
.admin input{width:100%;min-height:48px;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--cream);font-size:16px;-webkit-user-select:text;user-select:text}
.admin textarea{width:100%;height:120px;font:13px/1.4 ui-monospace,Menlo,monospace;border:2px solid var(--ink);border-radius:10px;padding:8px;-webkit-user-select:text;user-select:text}
.admin .row{flex-wrap:wrap}
.admin .row .btn{flex:1 1 140px}
.admin .btn{box-shadow:var(--sh-s)}
.pin{display:grid;gap:16px;justify-items:center;padding-top:8vh;direction:ltr}
.pin .dotsrow{display:flex;gap:14px}
.pin .dotsrow i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.pin .dotsrow i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:12px}
.pad .btn{min-height:74px;font-size:28px;font-family:var(--display)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:999px;font-size:16px;font-weight:700;z-index:60;max-width:90vw;text-align:center}

/* ===== cactus ===== */
.cx .body{transform-origin:100px 190px;animation:sway 3.2s ease-in-out infinite}
.cx .armL{transform-origin:62px 118px}
.cx .armR{transform-origin:138px 100px}
.cx .lid{transform-origin:center;transform:scaleY(0);animation:blink 4.4s infinite}
.cx .lidR{animation-delay:.1s}
.cx .happyEye,.cx .winceEye,.cx .shades,.cx .flower,.cx .brow{opacity:0;transition:opacity .15s}
.cx.happy .body{animation:hop .5s ease-out 1}
.cx.happy .armL{animation:armUpL .4s ease-out forwards}
.cx.happy .armR{animation:armUpR .4s ease-out forwards}
.cx.happy .happyEye,.cx.happy .flower{opacity:1}
.cx.happy .eyeOpen{opacity:0}
.cx.happy .mouth{d:path("M82 150 Q100 172 118 150")}
.cx.wince .body{animation:lean .4s ease-out forwards}
.cx.wince .winceEye{opacity:1}
.cx.wince .eyeR,.cx.wince .lidR{opacity:0}
.cx.wince .mouth{d:path("M86 160 Q100 150 114 160")}
.cx.think .brow{opacity:1}
.cx.think .armR{animation:chin .4s ease-out forwards}
.cx.think .mouth{d:path("M90 157 L110 157")}
.cx.celebrate .body{animation:hop .5s ease-out infinite}
.cx.celebrate .armL{animation:armUpL .4s ease-out forwards}
.cx.celebrate .armR{animation:armUpR .4s ease-out forwards}
.cx.celebrate .shades,.cx.celebrate .flower{opacity:1}
.cx.celebrate .mouth{d:path("M80 148 Q100 176 120 148")}
.cx.wave .armR{animation:wave 1.1s ease-in-out infinite}
.cx.wave .mouth{d:path("M86 150 Q100 166 114 150")}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96%,98%{transform:scaleY(1)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-22px)}70%{transform:translateY(0)}85%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes lean{to{transform:rotate(-7deg) translateX(-4px)}}
@keyframes armUpL{to{transform:rotate(28deg)}}
@keyframes armUpR{to{transform:rotate(-28deg)}}
@keyframes chin{to{transform:rotate(-40deg) translate(6px,-6px)}}
@keyframes wave{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-55deg)}}
@media (prefers-reduced-motion:reduce){.cx *,.attract .bubble{animation:none!important}}

/* phones (the booth build is for iPad; this keeps it usable on a phone for testing and sharing) */
@media (max-width:560px){
  html,body{font-size:16px}
  #app{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .hdr{height:46px;gap:10px} .brand{font-size:14px} .brand img{height:30px} .dots i{width:10px;height:10px} .scorechip{font-size:18px;padding:5px 11px}
  .stage{height:clamp(110px,17vh,150px);gap:10px;margin-top:2px}
  .bubble{padding:10px 14px;font-size:clamp(15px,2.2vh,19px);border-radius:16px;box-shadow:var(--sh-s)} .bubble.big{font-size:clamp(18px,2.6vh,22px)}
  .game{padding-top:8px;gap:8px}
  .title{font-size:clamp(22px,3vh,28px)} .q{font-size:clamp(17px,2.4vh,21px)}
  .btn{min-height:52px;font-size:18px;padding:10px 14px;border-radius:14px;box-shadow:var(--sh-s)} .btn.primary{font-size:21px}
  .chip{min-height:42px;font-size:16px;padding:8px 14px}
  .field input{min-height:50px;font-size:18px} .consent{font-size:14px;padding:10px 12px}
  .attract .hero h1{font-size:clamp(34px,6vh,56px);text-shadow:3px 3px 0 var(--sun)} .attract .hero .eyebrow{font-size:12px}
  .attract .stage{height:clamp(140px,22vh,200px);gap:12px}
  .panels{grid-template-columns:1fr} .panels .panel:nth-child(2){display:none}
  .panel{padding:10px 14px} .lb li{font-size:16px;padding:6px 0} .lb .s{font-size:18px}
  .deal .pitch{font-size:clamp(17px,2.5vh,22px);padding:14px 16px} .deal .head{padding:8px 14px;font-size:12px} .deal .stamp{font-size:24px;top:50px}
  .dealBtns .btn{font-size:22px}
  .slider output{font-size:clamp(44px,8vh,64px)} .slider input[type=range]{margin:14px 0 4px}
  .reveal{padding:14px 16px;gap:8px} .reveal .pts{font-size:clamp(40px,6vh,56px)} .reveal .big{font-size:clamp(24px,3.4vh,30px)} .reveal p{font-size:clamp(15px,2.2vh,18px)}
  .logoMini canvas{width:110px!important;height:110px!important}
  .mazeHud .title{font-size:clamp(20px,2.8vh,26px)} .hudchip{font-size:17px;padding:5px 12px}
  .scoreBox .big{font-size:clamp(64px,12vh,110px);text-shadow:3px 3px 0 var(--sun)} .scoreBox .rank{font-size:16px}
  .ctas{gap:8px} .ctas .btn{min-height:56px} .ctas .btn span{font-size:13px}
  .hint{font-size:13px}
  .deco .sun{width:34vw;height:34vw;top:-12vw}
}
@media (max-height:700px){ .stage{height:clamp(100px,15vh,140px)} .attract .stage{height:clamp(120px,20vh,170px)} }

freshState();

/* ---------- timers / idle ---------- */
const timers = new Set();
function after(ms, fn) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; }
function every(ms, fn) { const id = setInterval(fn, ms); timers.add(id); return id; }
function clearTimers() { timers.forEach(id => { clearTimeout(id); clearInterval(id); }); timers.clear(); }
let idleId = null;
function resetIdle() {
  clearTimeout(idleId);
  if (S.screen === "attract" || S.screen === "admin" || S.screen === "pin") return;
  const secs = S.screen === "form" ? cfg.formIdleSeconds : S.screen === "next" ? cfg.nextIdleSeconds : cfg.idleSeconds;
  idleId = setTimeout(() => abandon(), secs * 1000);
}
document.addEventListener("pointerdown", () => { resetIdle(); Sound.unlock(); }, { capture: true });
document.addEventListener("input", resetIdle, { capture: true });
document.addEventListener("keydown", resetIdle, { capture: true });
function abandon() { if (S.player && S.screen !== "next") sendResult(true); go("attract"); }

/* ---------- storage: board, leads, queue, stats ---------- */
const board = () => DB.get("board", []);
const analystEntries = () => (cfg.analysts || []).map((a, i) => ({ name: a.name, score: a.score, analyst: true, ts: "a" + i, faculty: "", year: "" }));
function fullBoard() { return board().concat(analystEntries()).sort((a, b) => b.score - a.score || String(a.ts).localeCompare(String(b.ts))); }
function rankOf(score) { return fullBoard().filter(e => e.score > score).length + 1; }
function upsertBoard(entry) {
  const b = board(); const i = b.findIndex(e => e.play_id === entry.play_id);
  if (i >= 0) { if (entry.score > b[i].score) b[i] = Object.assign({}, b[i], entry); } else b.push(entry);
  DB.set("board", b.slice(-2000));
}
function upsertLead(fields) { const leads = DB.get("leads", {}); leads[fields.play_id] = Object.assign({}, leads[fields.play_id] || {}, fields); DB.set("leads", leads); }
function dealStat(id, invested) { const s = DB.get("stats", {}); s[id] = s[id] || { i: 0, n: 0 }; if (invested !== undefined) { s[id].n++; if (invested) s[id].i++; DB.set("stats", s); } return s[id]; }

/* ---------- sync queue → Make webhook ---------- */
function enqueue(payload) { const q = DB.get("queue", []); q.push({ id: uuid(), payload, tries: 0 }); DB.set("queue", q); updatePending(); flush(); }
let flushing = false;
async function post(p) {
  if (cfg.postMode === "form") {
    await fetch(cfg.webhook, { method: "POST", mode: "no-cors", body: new URLSearchParams(Object.fromEntries(Object.entries(p).map(([k, v]) => [k, String(v)]))) });
    return;
  }
  const r = await fetch(cfg.webhook, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p) });
  if (!r.ok) throw new Error("HTTP " + r.status);
}
async function flush() {
  if (flushing || !cfg.webhook || !navigator.onLine) return;
  let q = DB.get("queue", []); if (!q.length) return;
  flushing = true;
  for (const item of q.slice()) {
    try { await post(item.payload); q = q.filter(x => x.id !== item.id); DB.set("queue", q); }
    catch (e) { item.tries++; DB.set("queue", q); break; }
  }
  flushing = false; updatePending();
}
window.addEventListener("online", flush);
setInterval(flush, 30000);
function updatePending() { const n = DB.get("queue", []).length; const el = $("#pending"); if (el) { el.textContent = n ? fmt(t("pending"), { n }) : ""; } }

function sendSignup() {
  const p = S.player;
  const payload = { event: "signup", play_id: p.play_id, full_name: p.name, phone: p.phone, faculty: p.faculty, year: p.year, device: DEVICE, lang: L, played_at: new Date().toISOString() };
  upsertLead(payload); enqueue(payload);
}
function sendResult(abandoned) {
  const p = S.player; if (!p) return;
  const deals = S.results.filter(r => r.type === "deal");
  const payload = { event: abandoned ? "abandoned" : "result", play_id: p.play_id, full_name: p.name, phone: p.phone, score: S.score, best_score: Math.max(S.best, S.score), attempt: S.attempt,
    rank_at_time: rankOf(S.score), deals_matched: deals.filter(r => r.ok).length, deals_seen: deals.length, maze_exit: !!(S.results.find(r => r.type === "maze") || {}).exit,
    consent: !!(S.interests.analyst || S.interests.idea || S.interests.updates), interest_analyst: !!S.interests.analyst, interest_idea: !!S.interests.idea, interest_updates: !!S.interests.updates, no_contact: !!S.interests.none, finished_at: new Date().toISOString(), device: DEVICE };
  upsertLead(payload); enqueue(payload);
}

/* ---------- sound (tiny, muted by default) ---------- */
const Sound = {
  ctx: null,
  unlock() { if (!cfg.sound) return; try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch (e) {} },
  tone(f, d, type = "sine", g = .08) { if (!cfg.sound || !this.ctx) return; try { const o = this.ctx.createOscillator(), a = this.ctx.createGain(); o.type = type; o.frequency.value = f; a.gain.value = g; o.connect(a); a.connect(this.ctx.destination); o.start(); a.gain.exponentialRampToValueAtTime(.0001, this.ctx.currentTime + d); o.stop(this.ctx.currentTime + d); } catch (e) {} },
  tap() { this.tone(660, .06, "square", .04); }, good() { this.tone(523, .12); setTimeout(() => this.tone(784, .2), 90); }, bad() { this.tone(180, .25, "sawtooth", .06); }, coin() { this.tone(1046, .08, "triangle", .06); }
};

function facultyAverages() {
  const m = {}; board().forEach(e => { if (!e.faculty) return; m[e.faculty] = m[e.faculty] || { s: 0, n: 0 }; m[e.faculty].s += e.score; m[e.faculty].n++; });
  return Object.entries(m).map(([name, v]) => ({ name, avg: Math.round(v.s / v.n), n: v.n })).sort((a, b) => b.avg - a.avg).slice(0, 6);
}

function startPlay() {
  S.games = buildGames(); S.gi = 0; S.score = 0; S.results = []; S.interests = {};
  go("game");
}
function buildGames() {
  const num = pick(NUMBERS, 1)[0];
  const pool = DEALS.filter(d => d.name !== num.company);
  const wins = pick(pool.filter(d => d.kind === "win"), 2), busts = pick(pool.filter(d => d.kind === "bust"), 2);
  const nw = Math.random() < 0.5 ? 1 : 2;
  const deals = shuffle(wins.slice(0, nw).concat(busts.slice(0, 3 - nw)));
  return [{ type: "logo", data: pick(LOGOS, 1)[0] }, { type: "num", data: num }, ...deals.map(d => ({ type: "deal", data: d })), { type: "maze" }];
}

/* --- game dispatcher --- */
Screens.game = function () { const g = S.games[S.gi]; Games[g.type](g); };
const Games = {};
function finish(result) {
  result.type = S.games[S.gi].type; S.results.push(result); S.score += result.pts;
  if (result.pts >= 60) Sound.good(); else Sound.bad();
  go("reveal", result);
}
function timerBar(seconds, onEnd) {
  const el = $("#timer"), bar = el && el.querySelector("i"); const t0 = Date.now(), ms = seconds * 1000; let done = false;
  const id = every(80, () => {
    const left = Math.max(0, ms - (Date.now() - t0));
    if (bar) bar.style.width = (left / ms * 100) + "%";
    if (el && left < ms * 0.3) el.classList.add("low");
    if (left <= 0 && !done) { done = true; clearInterval(id); timers.delete(id); onEnd(); }
  });
  return { elapsed: () => Math.min(ms, Date.now() - t0) / 1000, stop: () => { done = true; clearInterval(id); timers.delete(id); } };
}

/* --- game 1: logo reveal --- */
function luminance(hex) { const n = parseInt(hex, 16); const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
function drawLogo(ctx, W, H, logo, level) {
  // glyph rendered at a tiny resolution, then scaled up without smoothing → pixelation that sharpens as level → 1
  const light = luminance(logo.hex) > 0.62;
  const px = Math.max(4, Math.round(4 * Math.pow(96 / 4, level)));
  const off = drawLogo.off || (drawLogo.off = document.createElement("canvas")); off.width = px; off.height = px;
  const o = off.getContext("2d"); o.clearRect(0, 0, px, px);
  if (light) { o.fillStyle = "#" + logo.hex; o.beginPath(); if (o.roundRect) o.roundRect(0, 0, px, px, px * .2); else o.rect(0, 0, px, px); o.fill(); }
  o.save(); o.translate(px * .1, px * .1); o.scale(px * .8 / 24, px * .8 / 24); o.fillStyle = light ? "#1e2a21" : "#" + logo.hex; o.fill(new Path2D(logo.d)); o.restore();
  const size = Math.min(W, H) * .78; ctx.clearRect(0, 0, W, H); ctx.imageSmoothingEnabled = level > 0.985;
  ctx.drawImage(off, 0, 0, px, px, (W - size) / 2, (H - size) / 2, size, size);
}
Games.logo = function (g) {
  const d = g.data; const others = pick(LOGOS.filter(x => x.id !== d.id), 3).map(x => x.name); const opts = shuffle([d.name, ...others]);
  app.innerHTML = shell(S.gi, "think", ln("logo"), `
    <div class="title">${esc(t("g1"))}</div>
    <div class="timer" id="timer"><i></i></div>
    <div class="logoBox" id="logoBox"><canvas id="lc"></canvas></div>
    <div class="grid2">${opts.map(o => `<button class="btn" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`);
  const box = $("#logoBox"), cv = $("#lc"), r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const W = Math.round(r.width - 8), H = Math.round(r.height - 8); cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const secs = cfg.logoSeconds; let tm; let lastLevel = -1;
  const draw = level => { level = Math.min(1, level); const q = Math.round(level * 40) / 40; if (q === lastLevel) return; lastLevel = q; drawLogo(ctx, W, H, d, level); };
  draw(0);
  const tick = every(60, () => draw(tm.elapsed() / secs));
  const answer = v => { tm.stop(); clearInterval(tick); timers.delete(tick); lastLevel = -1; draw(1);
    const ok = v === d.name, el = tm.elapsed(); const pts = ok ? Math.round(100 - 60 * Math.min(1, el / secs)) : 0;
    app.querySelectorAll("[data-v]").forEach(b => { b.disabled = true; if (b.dataset.v === d.name) b.classList.add("ok"); else if (b.dataset.v === v) b.classList.add("no"); });
    setPose(ok ? "happy" : "wince");
    after(800, () => finish({ pts, ok, label: v === null ? t("timeout") : ok ? t("correct") : t("wrong"), big: d.name, text: "", picked: v, logo: d }));
  };
  tm = timerBar(secs, () => answer(null));
  app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { Sound.tap(); answer(b.dataset.v); });
};

/* --- game 6: maze --- */
Games.maze = function () {
  const COLS = cfg.mazeCols, ROWS = cfg.mazeRows;
  app.innerHTML = shell(S.gi, "wave", ln("maze"), `
    <div class="mazeHud"><span class="title">${esc(t("g6"))}</span><span class="hudchip num" id="hud">💵 0 · ${cfg.mazeSeconds}s</span></div>
    <div class="timer" id="timer"><i></i></div>
    <div class="mazeWrap" id="mw"><canvas id="mz"></canvas></div>
    <div class="hint">${esc(t("mazeHint"))}</div>`);
  const cells = genMaze(COLS, ROWS); const at = (r, c) => cells[r * COLS + c];
  const exit = { r: ROWS - 1, c: COLS - 1 }; const tok = { r: 0, c: 0 }; let got = 0, over = false;
  const free = []; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!(r === 0 && c === 0) && !(r === exit.r && c === exit.c) && (r + c) >= 3) free.push({ r, c });
  const billSet = new Set(pick(free, cfg.mazeBills).map(p => p.r + "," + p.c));
  const wrap = $("#mw"), cv = $("#mz"), rect = wrap.getBoundingClientRect();
  const cs = Math.floor(Math.min((rect.width - 20) / COLS, (rect.height - 20) / ROWS)); const W = cs * COLS + 10, H = cs * ROWS + 10; const dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); const ox = 5, oy = 5;
  const name = (S.player ? S.player.name : "").split(" ")[0] || "";
  let px = ox + cs / 2, py = oy + cs / 2; const target = () => ({ x: ox + (tok.c + .5) * cs, y: oy + (tok.r + .5) * cs });
  const font = getComputedStyle(document.body).fontFamily;
  const tm = timerBar(cfg.mazeSeconds, () => end(false));
  const hud = every(200, () => { const s = Math.max(0, Math.ceil(cfg.mazeSeconds - tm.elapsed())); const h = $("#hud"); if (h) h.textContent = `💵 ${got} · ${s}s`; });
  function draw() {
    if (S.screen !== "game") over = true;
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#fffaf0"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#2f9e5a"; ctx.fillRect(ox + exit.c * cs, oy + exit.r * cs, cs, cs);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fffaf0";
    ctx.font = `${Math.round(cs * .34)}px ${font}`; ctx.fillText("🚀", ox + (exit.c + .5) * cs, oy + (exit.r + .34) * cs);
    ctx.font = `800 ${Math.round(cs * .24)}px ${font}`; ctx.fillText("EXIT", ox + (exit.c + .5) * cs, oy + (exit.r + .74) * cs);
    ctx.font = `${Math.round(cs * .5)}px ${font}`;
    billSet.forEach(k => { const [r, c] = k.split(",").map(Number); ctx.fillText("💵", ox + (c + .5) * cs, oy + (r + .55) * cs); });
    ctx.strokeStyle = "#1e2a21"; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const w = at(r, c).w, x = ox + c * cs, y = oy + r * cs;
      if (w[0]) { ctx.moveTo(x, y); ctx.lineTo(x + cs, y); } if (w[3]) { ctx.moveTo(x, y); ctx.lineTo(x, y + cs); }
      if (c === COLS - 1 && w[1]) { ctx.moveTo(x + cs, y); ctx.lineTo(x + cs, y + cs); } if (r === ROWS - 1 && w[2]) { ctx.moveTo(x, y + cs); ctx.lineTo(x + cs, y + cs); } }
    ctx.stroke();
    const tg = target(); px += (tg.x - px) * .35; py += (tg.y - py) * .35;
    const R = cs * .3; ctx.fillStyle = "#f2b544"; ctx.strokeStyle = "#1e2a21"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(px - R * .35, py - R * .15, R * .24, 0, Math.PI * 2); ctx.arc(px + R * .35, py - R * .15, R * .24, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1e2a21"; ctx.beginPath(); ctx.arc(px - R * .3, py - R * .12, R * .12, 0, Math.PI * 2); ctx.arc(px + R * .4, py - R * .12, R * .12, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(px, py + R * .15, R * .38, .15 * Math.PI, .85 * Math.PI); ctx.stroke();
    if (name) { ctx.font = `800 ${Math.max(12, Math.round(cs * .27))}px ${font}`; ctx.lineWidth = 4; ctx.strokeStyle = "#fffaf0"; ctx.strokeText(name, px, py - R - 10); ctx.fillStyle = "#1e2a21"; ctx.fillText(name, px, py - R - 10); }
    if (!over) raf = requestAnimationFrame(draw);
  }
  let raf = requestAnimationFrame(draw);
  function step(d) { const dr = [-1, 0, 1, 0][d], dc = [0, 1, 0, -1][d]; tok.r += dr; tok.c += dc; const k = tok.r + "," + tok.c; if (billSet.has(k)) { billSet.delete(k); got++; Sound.coin(); } if (tok.r === exit.r && tok.c === exit.c) end(true); }
  function moveToward(x, y) {
    for (let guard = 0; guard < 4 && !over; guard++) {
      const tg = target(); const dx = x - tg.x, dy = y - tg.y;
      if (Math.abs(dx) < cs * .6 && Math.abs(dy) < cs * .6) return;
      const h = Math.abs(dx) > Math.abs(dy); const dirs = h ? [dx > 0 ? 1 : 3, dy > 0 ? 2 : 0] : [dy > 0 ? 2 : 0, dx > 0 ? 1 : 3];
      let moved = false;
      for (const d of dirs) { const dist = (d === 1 || d === 3) ? Math.abs(dx) : Math.abs(dy); if (dist < cs * .6) continue; if (!at(tok.r, tok.c).w[d]) { step(d); moved = true; break; } }
      if (!moved) return;
    }
  }
  let down = false;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener("pointerdown", e => { down = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} const p = pos(e); moveToward(p.x, p.y); });
  cv.addEventListener("pointermove", e => { if (!down) return; const p = pos(e); moveToward(p.x, p.y); });
  cv.addEventListener("pointerup", () => down = false); cv.addEventListener("pointercancel", () => down = false);
  function end(exitReached) {
    if (over) return; over = true; tm.stop(); clearInterval(hud); timers.delete(hud); cancelAnimationFrame(raf); draw();
    const left = exitReached ? Math.max(0, Math.ceil(cfg.mazeSeconds - tm.elapsed())) : 0;
    const pts = Math.min(100, got * 10 + (exitReached ? 50 : 0) + left * 2);
    setPose(exitReached ? "celebrate" : "wince");
    after(600, () => finish({ pts, ok: exitReached, exit: exitReached, label: exitReached ? t("mazeExit") : t("mazeNoExit"), big: fmt(t("billsGot"), { n: got }), text: exitReached ? fmt(t("secLeft"), { s: left }) : "", maze: true }));
  }
};
function genMaze(cols, rows) {
  const cells = []; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push({ r, c, w: [1, 1, 1, 1], v: false });
  const idx = (r, c) => r * cols + c; const stack = [cells[0]]; cells[0].v = true;
  while (stack.length) {
    const cur = stack[stack.length - 1]; const nb = [];
    if (cur.r > 0 && !cells[idx(cur.r - 1, cur.c)].v) nb.push([0, cells[idx(cur.r - 1, cur.c)]]);
    if (cur.c < cols - 1 && !cells[idx(cur.r, cur.c + 1)].v) nb.push([1, cells[idx(cur.r, cur.c + 1)]]);
    if (cur.r < rows - 1 && !cells[idx(cur.r + 1, cur.c)].v) nb.push([2, cells[idx(cur.r + 1, cur.c)]]);
    if (cur.c > 0 && !cells[idx(cur.r, cur.c - 1)].v) nb.push([3, cells[idx(cur.r, cur.c - 1)]]);
    if (!nb.length) { stack.pop(); continue; }
    const [d, n] = nb[Math.floor(Math.random() * nb.length)]; cur.w[d] = 0; n.w[(d + 2) % 4] = 0; n.v = true; stack.push(n);
  }
  return cells;
}

/* --- confetti --- */
function confetti() {
  const cv = $("#confetti"); cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight; const ctx = cv.getContext("2d");
  const P = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, r: 5 + Math.random() * 6, c: ["#2f9e5a", "#f2b544", "#f28ab2", "#86d9a3", "#c9633a"][Math.floor(Math.random() * 5)], a: Math.random() * 6 }));
  const t0 = Date.now();
  (function frame() { ctx.clearRect(0, 0, cv.width, cv.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); });
    if (Date.now() - t0 < 3000) requestAnimationFrame(frame); else { cv.hidden = true; ctx.clearRect(0, 0, cv.width, cv.height); } })();
}

  $("#snd").onclick = () => { cfg.sound = !cfg.sound; saveCfg(); go("admin"); };
  app.querySelectorAll("[data-rm]").forEach(x => x.onclick = () => { cfg.analysts.splice(+x.dataset.rm, 1); saveCfg(); go("admin"); });
  $("#an-add").onclick = () => { const n = $("#an-name").value.trim(), s = parseInt($("#an-score").value, 10); if (!n || isNaN(s)) return; cfg.analysts = (cfg.analysts || []).concat([{ name: n, score: s }]); saveCfg(); go("admin"); };
  const csv = () => { const cols = ["play_id", "full_name", "phone", "faculty", "year", "consent", "score", "best_score", "attempt", "rank_at_time", "deals_matched", "maze_exit", "interest_analyst", "interest_idea", "interest_updates", "no_contact", "played_at", "finished_at", "device", "event"];
    const rows = [cols].concat(Object.values(leads).map(l => cols.map(c => l[c] ?? ""))); return rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n"); };
  $("#csv-copy").onclick = () => { const s = csv(); (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => toast("Copied " + Object.keys(leads).length + " rows"), () => { $("#csv").hidden = false; $("#csv").value = s; $("#csv").select(); toast("Select and copy manually"); }); };
  if ($("#csv-share")) $("#csv-share").onclick = () => { try { const f = new File([csv()], "cactus-leads.csv", { type: "text/csv" }); if (navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f], title: "Cactus leads" }); else navigator.share({ text: csv(), title: "Cactus leads" }); } catch (e) { toast("Share failed"); } };
  $("#csv-show").onclick = () => { $("#csv").hidden = !$("#csv").hidden; $("#csv").value = csv(); };
  $("#clear").onclick = () => { $("#clear2").hidden = false; };
  $("#clear2").onclick = () => { DB.set("board", []); DB.set("leads", {}); DB.set("stats", {}); toast("Cleared"); go("admin"); };
  $("#reload").onclick = () => location.reload();
  $("#close").onclick = () => go("attract");
};

let toastId; function toast(m) { let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); } el.textContent = m; clearTimeout(toastId); toastId = setTimeout(() => el.remove(), 2200); }

/* ---------- boot ---------- */
let pendingReload = false;
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadController) return; if (S.screen === "attract") location.reload(); else pendingReload = true; });
}
go("attract");
window.App = { VERSION, S: () => S, go, cfg, DB, flush, startPlay, LOGOS, DEALS, NUMBERS };
</script>
</body>
